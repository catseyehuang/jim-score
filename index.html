<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#3B82F6">
<title>Jim 的積分銀行</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-main: #F0F2F5;
    --bg-card: #FFFFFF;
    --primary: #3B82F6;
    --primary-light: #60A5FA;
    --primary-bg: #EFF6FF;
    --danger: #EF4444;
    --danger-bg: #FEF2F2;
    --success: #10B981;
    --success-bg: #ECFDF5;
    --warning: #F59E0B;
    --warning-bg: #FFFBEB;
    --text-main: #1F2937;
    --text-muted: #6B7280;
    --text-light: #FFFFFF;
    --border: #E5E7EB;
    --radius-xl: 1.5rem; /* 24px */
    --radius-lg: 1rem;   /* 16px */
    --radius-md: 0.75rem;/* 12px */
    --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
    --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
    --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
    --nav-h: 72px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: 'Nunito', sans-serif; background: var(--bg-main); color: var(--text-main); -webkit-font-smoothing: antialiased; }

  /* --- Layout --- */
.app-wrapper { max-width: 560px; margin: 0 auto; min-height: 100vh; background: var(--bg-card); display: flex; flex-direction: column; }
.app-main { flex: 1; overflow-y: auto; padding: 16px 16px calc(var(--nav-h) + 16px); background: var(--bg-main); }
@media (min-width: 600px) {
    body { background: #CBD5E1; padding: 24px 0; }
    .app-wrapper { border-radius: var(--radius-xl); box-shadow: var(--shadow-lg); min-height: 80vh; max-height: 90vh; }
    .app-main { border-radius: 0 0 var(--radius-xl) var(--radius-xl); }
  }

  /* --- Screens --- */
.screen { display: none; }
  .screen.active { display: block; }
  /* --- Header --- */
  .app-header {
    background: var(--bg-card);
    padding: 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid var(--border);
  }
  .user-icon {
    width: 40px; height: 40px;
    background: var(--primary); color: var(--text-light);
    border-radius: var(--radius-md);
    display: grid; place-items: center; font-size: 20px;
  }
  .header-title { font-size: 18px; font-weight: 800; color: var(--text-main); }

  /* --- Bottom Nav --- */
  .bottom-nav {
    position: absolute; bottom: 0; left: 0; right: 0;
    max-width: 560px; margin: 0 auto;
    height: var(--nav-h);
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(10px);
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-around;
    z-index: 100;
  }
  @media (min-width: 600px) {
    .bottom-nav { border-radius: 0 0 var(--radius-xl) var(--radius-xl); }
  }
  .nav-btn {
    flex: 1;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 4px;
    background: none; border: none; cursor: pointer;
    color: var(--text-muted);
    font-family: 'Nunito', sans-serif; font-size: 10px; font-weight: 700;
    transition: color 0.2s;
  }
  .nav-btn .icon { font-size: 24px; line-height: 1; }
  .nav-btn.active { color: var(--primary); }

  /* --- Home Screen --- */
  .home-card {
    background: var(--bg-card);
    border-radius: var(--radius-xl);
    padding: 24px;
    text-align: center;
    box-shadow: var(--shadow-md);
    margin-bottom: 24px;
  }
  .home-card-label {
    font-size: 14px; font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 8px;
  }
  .home-card-score {
    font-size: 72px;
    font-weight: 900;
    line-height: 1;
    color: var(--primary);
  }
  .home-card-footer {
    margin-top: 16px;
    display: inline-block;
    background: var(--primary-bg);
    color: var(--primary);
    font-size: 13px;
    font-weight: 700;
    padding: 8px 16px;
    border-radius: 99px;
  }

  /* --- Section --- */
  .section { margin-bottom: 24px; }
  .section-title {
    font-size: 18px;
    font-weight: 800;
    color: var(--text-main);
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  /* --- Record List (Home) --- */
  .record-list { display: flex; flex-direction: column; gap: 10px; }
  .record-item {
    background: var(--bg-card);
    border-radius: var(--radius-lg);
    padding: 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: var(--shadow-sm);
  }
  .record-icon {
    font-size: 20px;
    width: 40px; height: 40px;
    flex-shrink: 0;
    display: grid; place-items: center;
    border-radius: 50%;
  }
  .record-icon.add { background: var(--success-bg); color: var(--success); }
  .record-icon.sub { background: var(--danger-bg); color: var(--danger); }
  .record-icon.redeem { background: var(--warning-bg); color: var(--warning); }
  .record-icon.warn { background: var(--text-muted); color: var(--bg-card); }
  .record-info { flex: 1; min-width: 0; }
  .record-name { font-weight: 700; }
  .record-time { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
  .record-note { font-size: 12px; color: var(--text-muted); margin-top: 4px; font-style: italic; }
  .record-score {
    font-size: 20px;
    font-weight: 800;
    flex-shrink: 0;
  }
  .record-score.pos { color: var(--success); }
  .record-score.neg { color: var(--danger); }
  .record-score.zero { color: var(--warning); }

  /* --- Behavior Grid (Collect) --- */
  .behavior-grid { display: flex; flex-direction: column; gap: 10px; }
  .behavior-btn {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 16px;
    cursor: pointer;
    text-align: left;
    transition: all 0.18s;
    font-family: 'Nunito', sans-serif;
    display: flex;
    align-items: center;
    gap: 16px;
    box-shadow: var(--shadow-sm);
  }
  .behavior-btn:active { transform: scale(0.98); background: var(--bg-main); }
  .b-icon { font-size: 24px; }
  .b-info { flex: 1; }
  .b-name { font-size: 16px; font-weight: 700; color: var(--text-main); }
  .b-score { font-size: 20px; font-weight: 800; }
  .behavior-btn.add .b-score { color: var(--success); }
  .behavior-btn.sub .b-score { color: var(--danger); }
  .behavior-btn.warn .b-score { color: var(--warning); }

  /* --- Reward Grid --- */
  .reward-grid { display: flex; flex-direction: column; gap: 10px; }
  .reward-item {
    background: var(--bg-card);
    border-radius: var(--radius-lg);
    padding: 16px;
    display: flex;
    align-items: center;
    gap: 14px;
    box-shadow: var(--shadow-sm);
    border: 2px solid transparent;
    transition: all 0.18s;
  }
  .reward-item.affordable { border-color: var(--success); }
  .reward-item.locked { opacity: 0.6; }
  .reward-emoji { font-size: 32px; flex-shrink: 0; }
  .reward-info { flex: 1; min-width: 0; }
  .reward-name { font-size: 16px; font-weight: 800; }
  .reward-cost { font-size: 13px; color: var(--text-muted); margin-top: 2px; font-weight: 600; }
  .redeem-btn {
    background: var(--success);
    color: white;
    border: none;
    border-radius: var(--radius-md);
    padding: 10px 16px;
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 14px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .redeem-btn:active { transform: scale(0.95); }

  /* --- Admin Page --- */
  .admin-section {
    background: var(--bg-card);
    border-radius: var(--radius-lg);
    margin-bottom: 16px;
    box-shadow: var(--shadow-sm);
    overflow: hidden;
  }
  .admin-section-title {
    padding: 12px 16px;
    font-weight: 800;
    font-size: 14px;
    background: #F9FAFB;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .admin-row {
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 1px solid var(--border);
  }
  .admin-row:last-child { border-bottom: none; }
  .admin-row-info { flex: 1; min-width: 0; }
  .admin-row-name { font-size: 14px; font-weight: 700; }
  .admin-row-sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
  .badge {
    font-size: 11px;
    font-weight: 800;
    padding: 4px 10px;
    border-radius: 99px;
    flex-shrink: 0;
  }
  .badge.add { background: var(--success-bg); color: var(--success); }
  .badge.sub { background: var(--danger-bg); color: var(--danger); }
  .badge.warn { background: var(--warning-bg); color: var(--warning); }
  .icon-btn {
    background: none; border: none; cursor: pointer;
    font-size: 20px; padding: 4px;
    color: var(--text-muted);
    transition: color 0.15s;
  }
  .icon-btn:hover { color: var(--text-main); }
  .admin-content { padding: 16px; }

  /* --- Inputs & Buttons --- */
  input, select {
    font-family: 'Nunito', sans-serif;
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 12px 14px;
    font-size: 15px;
    width: 100%;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    background: var(--bg-card);
    color: var(--text-main);
  }
  input:focus, select:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px var(--primary-bg);
  }
  .input-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
  .input-group label { font-size: 13px; font-weight: 700; color: var(--text-muted); }
  .input-row { display: flex; gap: 10px; }

  .btn {
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 16px;
    border: none;
    border-radius: var(--radius-md);
    padding: 14px 20px;
    cursor: pointer;
    transition: all 0.18s;
    width: 100%;
  }
  .btn:active { transform: scale(0.97); }
  .btn-primary { background: var(--primary); color: var(--text-light); box-shadow: var(--shadow-md); }
  .btn-success { background: var(--success); color: var(--text-light); }
  .btn-danger { background: var(--danger); color: var(--text-light); }
  .btn-secondary { background: var(--border); color: var(--text-main); }
  .btn-sm { padding: 10px 16px; font-size: 14px; border-radius: var(--radius-md); width: auto; }

  /* --- Modal --- */
  .modal-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0, 0, 0, 0.5);
    z-index: 300;
    align-items: center; justify-content: center;
    backdrop-filter: blur(4px);
  }
.modal-overlay.show { display:flex; }
.modal {
    background: var(--bg-card);
    border-radius: var(--radius-xl);
    padding: 24px;
    width: 90%;
    max-width: 360px;
    animation: pop-in 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    box-shadow: var(--shadow-lg);
  }
@keyframes pop-in { from{transform:scale(0.8);opacity:0} to{transform:scale(1);opacity:1} }
.modal-title { font-size: 20px; font-weight: 800; text-align: center; margin-bottom: 8px; }
.modal-subtitle { text-align: center; color: var(--text-muted); font-size: 14px; margin-bottom: 20px; }
.modal-actions { margin-top: 16px; display: flex; flex-direction: column; gap: 8px; }

  /* --- PIN Modal --- */
  .pin-dots { display: flex; justify-content: center; gap: 16px; margin-bottom: 20px; }
  .pin-dot {
    width: 16px; height: 16px;
    border-radius: 50%;
    border: 2px solid var(--border);
    transition: all 0.2s;
  }
  .pin-dot.filled { background: var(--primary); border-color: var(--primary); }
  .pin-pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .pin-key {
    background: var(--bg-main);
    border: none;
    border-radius: var(--radius-lg);
    padding: 16px;
    font-size: 24px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s;
    text-align: center;
    color: var(--text-main);
  }
  .pin-key:active { transform: scale(0.92); background: var(--border); }
  .pin-error { color: var(--danger); font-size: 13px; text-align: center; margin-top: 12px; font-weight: 700; min-height: 20px; }

  /* --- Bottom Sheet --- */
  .bottom-sheet {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0, 0, 0, 0.45);
    z-index: 200;
    align-items: flex-end; justify-content: center;
  }
.bottom-sheet.show { display:flex; }
.sheet-body {
    background: var(--bg-card);
    border-radius: var(--radius-xl) var(--radius-xl) 0 0;
    padding: 24px 20px 40px;
    width: 100%;
    max-width: 560px;
    animation: slide-up 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
@keyframes slide-up { from{transform:translateY(100%)} to{transform:translateY(0)} }
.sheet-body h3 { font-size: 20px; font-weight: 800; margin-bottom: 20px; }
.sheet-actions { display: flex; gap: 10px; margin-top: 24px; }

  /* --- Toast --- */
  .toast {
    position: fixed;
    bottom: calc(var(--nav-h) + 16px);
    left: 50%;
    transform: translateX(-50%) translateY(10px);
    background: #27272A;
    color: white;
    padding: 12px 24px;
    border-radius: 99px;
    font-size: 14px;
    font-weight: 700;
    opacity: 0;
    transition: all 0.3s;
    z-index: 400;
    white-space: nowrap;
    pointer-events: none;
    box-shadow: var(--shadow-lg);
  }
.toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

  /* --- Misc --- */
.loading { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px; color: var(--text-muted); gap: 12px; }
.spinner { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to{transform:rotate(360deg)} }
.empty-state { text-align:center; padding:32px; color:var(--muted); }
.empty-state .big-emoji { font-size:48px; display:block; margin-bottom:8px; }
.score-adjust-row { display:flex; align-items:center; gap:10px; }
</style>
</head>
<body>
<div class="app-wrapper">

<header class="app-header">
  <div class="user-icon">👤</div>
  <h1 class="header-title">Jim 的積分銀行</h1>
</header>

<main class="app-main">
  <!-- SCREEN: 首頁 -->
  <div class="screen active" id="screen-home">
    <div class="home-card">
      <p class="home-card-label">目前可用總積分</p>
      <h2 class="home-card-score" id="homeScore">—</h2>
      <div id="progressHint" class="home-card-footer"></div>
    </div>
    <div class="section">
      <h3 class="section-title">最近紀錄</h3>
      <div class="record-list" id="recordList"><div class="loading"><div class="spinner"></div><span>載入中...</span></div></div>
    </div>
  </div>

  <!-- SCREEN: 獎勵 -->
  <div class="screen" id="screen-rewards">
    <div class="section">
      <h3 class="section-title">🎁 獎勵商店</h3>
      <p style="color:var(--text-muted); font-size:14px; margin-top:-8px; margin-bottom:12px;">目前有 <span id="rewardScore" style="font-weight:bold; color:var(--primary)">—</span> 分，可以換什麼？</p>
      <div class="reward-grid" id="rewardGrid"><div class="loading"><div class="spinner"></div><span>載入中...</span></div></div>
    </div>
  </div>

  <!-- SCREEN: 集點 -->
  <div class="screen" id="screen-collect">
    <div class="section">
      <h3 class="section-title">⭐ 集點記錄</h3>
      <p style="color:var(--text-muted); font-size:14px; margin-top:-8px; margin-bottom:12px;">選擇行為，幫 Jim 加減分</p>
      <div class="behavior-grid" id="behaviorGrid"><div class="loading"><div class="spinner"></div><span>載入中...</span></div></div>
    </div>
  </div>

  <!-- SCREEN: 家長後台 -->
  <div class="screen" id="screen-admin">
    <div class="section">
      <h3 class="section-title">🔐 家長後台</h3>
      <div class="admin-section">
        <div class="admin-section-title">⚡ 總分調整</div>
        <div class="admin-content">
          <div style="text-align:center;margin-bottom:12px">
            <span style="font-size:13px;color:var(--text-muted)">目前總分：</span>
            <span style="font-size:28px;color:var(--primary); font-weight:800" id="adminScore">—</span>
            <span style="color:var(--text-muted)"> 分</span>
          </div>
          <div class="score-adjust-row">
            <input type="number" id="adjustScoreInput" placeholder="輸入新的總分">
            <button class="btn btn-primary btn-sm" onclick="doAdjustScore()">更新</button>
          </div>
        </div>
      </div>
      <div class="admin-section">
        <div class="admin-section-title">🎯 行為項目 <button class="btn btn-primary btn-sm" onclick="openAddBehavior()">＋ 新增</button></div>
        <div id="adminBehaviorList"><div class="loading"><div class="spinner"></div></div></div>
      </div>
      <div class="admin-section">
        <div class="admin-section-title">🎁 獎勵項目 <button class="btn btn-success btn-sm" onclick="openAddReward()">＋ 新增</button></div>
        <div id="adminRewardList"><div class="loading"><div class="spinner"></div></div></div>
      </div>
      <div class="admin-section">
        <div class="admin-section-title">🔑 修改 PIN 碼</div>
        <div class="admin-content" style="display:flex;gap:10px">
          <input type="password" id="newPinInput" placeholder="輸入新的4位數PIN" maxlength="4" style="flex:1">
          <button class="btn btn-primary btn-sm" onclick="doUpdatePin()">更新</button>
        </div>
      </div>
    </div>
  </div>
</main>

<!-- MODALS & SHEETS -->
<div class="modal-overlay" id="pinModal">
  <div class="modal">
    <h2 class="modal-title">🔐 家長驗證</h2>
    <p class="modal-subtitle">請輸入 4 位數密碼</p>
    <div class="pin-dots" id="pinDots">
      <div class="pin-dot"></div><div class="pin-dot"></div>
      <div class="pin-dot"></div><div class="pin-dot"></div>
    </div>
    <div class="pin-pad">
      <button class="pin-key" onclick="pinKey('1')">1</button>
      <button class="pin-key" onclick="pinKey('2')">2</button>
      <button class="pin-key" onclick="pinKey('3')">3</button>
      <button class="pin-key" onclick="pinKey('4')">4</button>
      <button class="pin-key" onclick="pinKey('5')">5</button>
      <button class="pin-key" onclick="pinKey('6')">6</button>
      <button class="pin-key" onclick="pinKey('7')">7</button>
      <button class="pin-key" onclick="pinKey('8')">8</button>
      <button class="pin-key" onclick="pinKey('9')">9</button>
      <div></div>
      <button class="pin-key" onclick="pinKey('0')">0</button>
      <button class="pin-key" onclick="pinDel()">⌫</button>
    </div>
    <div class="pin-error" id="pinError"></div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closePinModal()">取消</button>
    </div>
  </div>
</div>

<div class="bottom-sheet" id="confirmSheet">
  <div class="sheet-body">
    <h3 id="confirmName"></h3>
    <div class="input-group">
      <label>分數</label>
      <input id="confirmScore" type="number" min="0">
    </div>
    <div class="input-group">
      <label>原因／備註（選填）</label>
      <input type="text" id="confirmNote" placeholder="例如：今天特別認真！">
    </div>
    <div class="sheet-actions">
      <button class="btn btn-secondary" onclick="closeConfirmSheet()">取消</button>
      <button class="btn btn-primary" id="confirmBtn" onclick="submitRecord()">✅ 確認送出</button>
    </div>
  </div>
</div>

<div class="bottom-sheet" id="behaviorSheet">
  <div class="sheet-body">
    <h3 id="behaviorFormTitle">新增行為項目</h3>
    <div class="input-group"><label>行為名稱</label><input type="text" id="bName" placeholder="例如：完成作業"></div>
    <div class="input-group">
      <label>類型 & 分數</label>
      <div class="input-row">
        <select id="bType"><option value="加分">✅ 加分</option><option value="扣分">➖ 扣分</option><option value="警告">⚠️ 警告</option></select>
        <input type="number" id="bScore" placeholder="分數" style="max-width:110px">
    </div>
    </div>
    <div class="sheet-actions">
      <button class="btn btn-secondary" onclick="closeBehaviorSheet()">取消</button>
      <button class="btn btn-primary" onclick="saveBehavior()">儲存</button>
    </div>
  </div>
</div>

<div class="bottom-sheet" id="rewardSheet">
  <div class="sheet-body">
    <h3 id="rewardFormTitle">新增獎勵項目</h3>
    <div class="input-group"><label>獎勵名稱</label><input type="text" id="rName" placeholder="例如：看一集卡通"></div>
    <div class="input-group"><label>所需分數</label><input type="number" id="rScore" placeholder="例如：20"></div>
    <div class="sheet-actions">
      <button class="btn btn-secondary" onclick="closeRewardSheet()">取消</button>
      <button class="btn btn-success" onclick="saveReward()">儲存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">
  <button class="nav-btn active" id="nav-home" onclick="showScreen('home')">
    <span class="icon">🏠</span><span class="label">首頁</span>
  </button>
  <button class="nav-btn" id="nav-collect" onclick="requirePin('collect')">
    <span class="icon">⭐</span><span class="label">集點</span>
  </button>
  <button class="nav-btn" id="nav-rewards" onclick="showScreen('rewards')">
    <span class="icon">🎁</span><span class="label">獎勵</span>
  </button>
  <button class="nav-btn" id="nav-admin" onclick="requirePin('admin')">
    <span class="icon">🔐</span><span class="label">家長</span>
  </button>
</nav>

</div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbygTRoYhiLKqYmi9eM6J4bTBHIY1A2cz_vYG3PUHgB4Hn5gooArylWuZeSJCDYRTAKSZg/exec';
let currentScore = 0;
let behaviors = [];
let rewards = [];
let pinCallback = null;
let pinStr = '';
let pendingBehavior = null;
let editBehaviorIndex = null;
let editRewardIndex = null;

// ── INIT ──
window.addEventListener('DOMContentLoaded', () => {
  loadHome();
});

// ── API ──
async function api(action, params = {}) {
  try {
    const qs = new URLSearchParams({ action, ...params }).toString();
    const res = await fetch(`${API_URL}?${qs}`);
    if (!res.ok) {
        showToast(`❌ 網路錯誤: ${res.status}`);
        return null;
    }
    return await res.json();
  } catch(e) {
    showToast('❌ 連線失敗，請稍後再試');
    return null;
  }
}

// ── NAV ──
function showScreen(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  
  const screenEl = document.getElementById('screen-' + name);
  if (screenEl) screenEl.classList.add('active');
  
  // The nav button for collect and admin are different from their screen names
  let navId = name;
  const navBtn = document.getElementById('nav-' + navId);
  if(navBtn) navBtn.classList.add('active');

  if (name === 'home') loadHome();
  if (name === 'rewards') loadRewards();
  if (name === 'collect') loadCollect();
  if (name === 'admin') loadAdmin();
}

// ── PIN ──
function requirePin(cb) {
  pinStr = ''; pinCallback = cb;
  updatePinDots();
  document.getElementById('pinError').textContent = '';
  document.getElementById('pinModal').classList.add('show');
}
function closePinModal() { document.getElementById('pinModal').classList.remove('show'); pinStr = ''; }
function pinKey(k) {
  if (pinStr.length >= 4) return;
  pinStr += k; updatePinDots();
  if (pinStr.length === 4) setTimeout(verifyPin, 150);
}
function pinDel() { pinStr = pinStr.slice(0,-1); updatePinDots(); }
function updatePinDots() {
  document.querySelectorAll('#pinDots .pin-dot').forEach((d,i) => d.classList.toggle('filled', i < pinStr.length));
}
async function verifyPin() {
  const res = await api('checkPin', { pin: pinStr });
  if (res && res.success) {
    closePinModal();
    if (pinCallback === 'collect' || pinCallback === 'admin') {
      showScreen(pinCallback);
    } else if (pinCallback && pinCallback.startsWith('redeem|')) {
      const parts = pinCallback.split('|');
      doRedeem(decodeURIComponent(parts[1]), parseInt(parts[2]));
    }
  } else {
    document.getElementById('pinError').textContent = '❌ PIN 碼錯誤，請再試一次';
    const modal = document.getElementById('pinModal').querySelector('.modal');
    modal.style.animation = 'shake 0.5s';
    setTimeout(() => modal.style.animation = '', 500);
    pinStr = ''; updatePinDots();
  }
}

// ── HOME ──
async function loadHome() {
  const [scoreRes, rewardRes, recordRes] = await Promise.all([
    api('getScore'), api('getRewards'), api('getRecords')
  ]);
  if (scoreRes?.success) { currentScore = scoreRes.score; document.getElementById('homeScore').textContent = currentScore; }
  if (rewardRes?.success) { rewards = rewardRes.rewards.filter(r => r.status === '上架'); renderProgress(); }
  if (recordRes?.success) renderRecords(recordRes.records);
}

function renderProgress() {
  const hintEl = document.getElementById('progressHint');
  const sorted = [...rewards].sort((a,b) => a.score - b.score);
  const next = sorted.find(r => r.score > currentScore);
  if (!next) { 
    hintEl.textContent = '所有獎勵都可兌換！🎉';
    return; 
  }
  hintEl.textContent = `再 ${next.score - currentScore} 分就可以兌換「${next.name}」！`;
}

function renderRecords(records) {
  const list = document.getElementById('recordList');
  if (!records?.length) {
    list.innerHTML = '<div class="empty-state"><span class="big-emoji">🌟</span>還沒有紀錄，快去集點吧！</div>';
    return;
  }
  list.innerHTML = records.slice(0,15).map(r => {
    const s = Number(r.score);
    let icon, cls, scoreDisplay;
    if (r.type === '加分') {
        icon = '⭐'; cls = 'add'; scoreDisplay = `+${s}`;
    } else if (r.type === '扣分') {
        icon = '😔'; cls = 'sub'; scoreDisplay = `${s}`;
    } else if (r.type === '兌換') {
        icon = '🎁'; cls = 'redeem'; scoreDisplay = `${s}`;
    } else { // 警告
        icon = '⚠️'; cls = 'warn'; scoreDisplay = '⚠️';
    }
    
    return `<div class="record-item">
      <div class="record-icon ${cls}">${icon}</div>
      <div class="record-info">
        <div class="record-name">${r.name}</div>
        <div class="record-time">${new Date(r.time).toLocaleString('zh-TW', { month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit'})}</div>
        ${r.note ? `<div class="record-note">📝 ${r.note}</div>` : ''}
      </div>
      <div class="record-score ${s > 0 ? 'pos' : 'neg'}">${scoreDisplay}</div>
    </div>`;
  }).join('');
}

// ── REWARDS ──
async function loadRewards() {
  const [sRes, rRes] = await Promise.all([api('getScore'), api('getRewards')]);
  if (sRes?.success) { currentScore = sRes.score; document.getElementById('rewardScore').textContent = currentScore; }
  if (rRes?.success) { rewards = rRes.rewards.filter(r => r.status==='上架'); renderRewards(); }
}
function renderRewards() {
  const grid = document.getElementById('rewardGrid');
  if (!rewards.length) { grid.innerHTML='<div class="empty-state"><span class="big-emoji">🎁</span>尚無獎勵，請家長後台新增！</div>'; return; }
  const emojis = ['🍭','🎮','🎢','🍕','📚','🎨','🎯','🏆','🎪','🌈'];
  grid.innerHTML = [...rewards].sort((a,b)=>a.score-b.score).map((r,i) => {
    const can = currentScore >= r.score;
    return `<div class="reward-item ${can?'affordable':'locked'}">
      <div class="reward-emoji">${emojis[i%emojis.length]}</div>
      <div class="reward-info">
        <div class="reward-name">${r.name}</div>
        <div class="reward-cost">需要 ${r.score} 分${can?' ✅':''}</div>
      </div>
      ${can ? `<button class="redeem-btn" onclick="startRedeem('${encodeURIComponent(r.name)}',${r.score})">兌換</button>`
             : `<span style="font-size:20px;color:var(--muted)">🔒</span>`}
    </div>`;
  }).join('');
}
function startRedeem(name, cost) { requirePin(`redeem|${name}|${cost}`); }
async function doRedeem(name, cost) {
  const res = await api('redeemReward', { name, cost });
  if (res?.success) {
    currentScore = res.newScore;
    document.getElementById('homeScore').textContent = currentScore;
    document.getElementById('rewardScore').textContent = currentScore;
    showToast(`🎉 已兌換：${name}！`);
    renderRewards(); renderProgress();
    const rr = await api('getRecords');
    if (rr?.success) renderRecords(rr.records);
  } else showToast(res?.message || '兌換失敗');
}

// ── COLLECT ──
async function loadCollect() {
  const res = await api('getBehaviors');
  if (res?.success) { behaviors = res.behaviors; renderBehaviorGrid(); }
}
function renderBehaviorGrid() {
  const grid = document.getElementById('behaviorGrid');
  if (!behaviors.length) { grid.innerHTML='<div class="empty-state" style="grid-column:1/-1"><span class="big-emoji">📝</span>尚無行為項目，請至家長後台新增</div>'; return; }
  const icons = {'加分':'⭐', '扣分':'😔', '警告':'⚠️'};
  grid.innerHTML = behaviors.map(b => {
    const cls = b.type==='加分'?'add':b.type==='扣分'?'sub':'warn';
    const s = Number(b.score);
    const display = b.type==='警告' ? '警告' : (s>0?'+':'')+s + '分';
    return `<button class="behavior-btn ${cls}" onclick="openConfirm(${b.index})">
      <span class="b-icon">${icons[b.type] || '📝'}</span>
      <div class="b-info">
        <span class="b-name">${b.name}</span>
      </div>
      <span class="b-score">${display}</span>
    </button>`;
  }).join('');
}
function openConfirm(index) {
  const b = behaviors.find(bh => bh.index===index);
  if (!b) return;
  pendingBehavior = b;
  document.getElementById('confirmName').textContent = b.name;
  document.getElementById('confirmNote').value = '';
  const si = document.getElementById('confirmScore');
  si.value = Math.abs(Number(b.score));
  si.disabled = b.type==='警告';
  const btn = document.getElementById('confirmBtn');
  btn.className = 'btn '+(b.type==='加分'?'btn-success':b.type==='扣分'?'btn-danger':'btn-primary');
  document.getElementById('confirmSheet').classList.add('show');
}
function closeConfirmSheet() { document.getElementById('confirmSheet').classList.remove('show'); pendingBehavior=null; }
async function submitRecord() {
  if (!pendingBehavior) return;
  const b = pendingBehavior;
  let score = b.type==='警告' ? 0 : (parseInt(document.getElementById('confirmScore').value)||0);
  const note = document.getElementById('confirmNote').value.trim();
  // 根據行為類型強制校正分數的正負號，使邏輯更穩固
  if (b.type === '加分') {
    score = Math.abs(score);
  } else if (b.type === '扣分') {
    score = -Math.abs(score);
  }
  closeConfirmSheet();
  showToast('⏳ 記錄中...');
  const res = await api('addRecord', { name:b.name, score, type:b.type, note });
  if (res?.success) {
    currentScore = res.newScore;
    document.getElementById('homeScore').textContent = currentScore;
    const verb = b.type==='警告'?'已記錄警告':score>0?`+${score} 分！`:`${score} 分`;
    showToast(`${b.type==='加分'?'⭐':b.type==='扣分'?'😔':'⚠️'} ${b.name}　${verb}`);
    renderProgress();
    const rr = await api('getRecords');
    if (rr?.success) renderRecords(rr.records);
  } else showToast('❌ 記錄失敗：'+(res?.message||'連線錯誤'));
}

// ── ADMIN ──
async function loadAdmin() {
  const [sRes, bRes, rRes] = await Promise.all([api('getScore'), api('getBehaviors'), api('getRewards')]);
  if (sRes?.success) { currentScore=sRes.score; document.getElementById('adminScore').textContent=currentScore; }
  if (bRes?.success) { behaviors=bRes.behaviors; renderAdminBehaviors(); }
  if (rRes?.success) { rewards=rRes.rewards; renderAdminRewards(); }
}
function renderAdminBehaviors() {
  const list = document.getElementById('adminBehaviorList');
  if (!behaviors.length) { list.innerHTML='<div class="admin-content empty-state">尚無行為項目</div>'; return; }
  list.innerHTML = behaviors.map(b => {
    const cls=b.type==='加分'?'add':b.type==='扣分'?'sub':'warn';
    const s=Number(b.score); const prefix=s>0?'+':'';
    return `<div class="admin-row">
      <div class="admin-row-info">
        <div class="admin-row-name">${b.name}</div>
        <div class="admin-row-sub">${b.type==='警告'?'0 分':prefix+s+' 分'}</div>
      </div>
      <span class="badge ${cls}">${b.type}</span>
      <button class="icon-btn" onclick="openEditBehavior(${b.index})">✏️</button>
    </div>`;
  }).join('');
}
function renderAdminRewards() {
  const list = document.getElementById('adminRewardList');
  if (!rewards.length) { list.innerHTML='<div class="admin-content empty-state">尚無獎勵項目</div>'; return; }
  list.innerHTML = rewards.map(r => `<div class="admin-row">
      <div class="admin-row-info">
        <div class="admin-row-name">${r.name}</div>
        <div class="admin-row-sub">${r.score} 分 · ${r.status}</div>
      </div>
      <button class="icon-btn" onclick="openEditReward(${r.index})">✏️</button>
  </div>`).join('');
}
async function doAdjustScore() {
  const val = document.getElementById('adjustScoreInput').value;
  if (val==='') return showToast('請輸入分數');
  const res = await api('adjustScore', { score: parseInt(val) });
  if (res?.success) {
    currentScore=parseInt(val);
    document.getElementById('adminScore').textContent=currentScore;
    document.getElementById('homeScore').textContent=currentScore;
    document.getElementById('adjustScoreInput').value='';
    showToast('✅ 總分已更新');
  }
}
async function doUpdatePin() {
  const pin = document.getElementById('newPinInput').value;
  if (pin.length!==4||isNaN(pin)) return showToast('請輸入4位數字PIN');
  const res = await api('updatePin', { newPin: pin });
  if (res?.success) { document.getElementById('newPinInput').value=''; showToast('✅ PIN 碼已更新'); }
}

// BEHAVIOR FORM
function openAddBehavior() { editBehaviorIndex=null; document.getElementById('behaviorFormTitle').textContent='新增行為項目'; document.getElementById('bName').value=''; document.getElementById('bScore').value=''; document.getElementById('bType').value='加分'; document.getElementById('behaviorSheet').classList.add('show'); }
function openEditBehavior(index) { const b=behaviors.find(bh=>bh.index===index); if(!b)return; editBehaviorIndex=index; document.getElementById('behaviorFormTitle').textContent='編輯行為項目'; document.getElementById('bName').value=b.name; document.getElementById('bScore').value=Math.abs(Number(b.score)); document.getElementById('bType').value=b.type; document.getElementById('behaviorSheet').classList.add('show'); }
function closeBehaviorSheet() { document.getElementById('behaviorSheet').classList.remove('show'); }
async function saveBehavior() {
  const name=document.getElementById('bName').value.trim();
  const type=document.getElementById('bType').value;
  let score=parseInt(document.getElementById('bScore').value)||0;
  if(!name) return showToast('請輸入行為名稱');
  if(type==='扣分') score=-Math.abs(score);
  if(type==='警告') score=0;
  const res = editBehaviorIndex!==null ? await api('updateBehavior',{index:editBehaviorIndex,name,score,type}) : await api('addBehavior',{name,score,type});
  if(res?.success){closeBehaviorSheet();showToast('✅ 已儲存');loadAdmin();loadCollect();}
}

// REWARD FORM
function openAddReward() { editRewardIndex=null; document.getElementById('rewardFormTitle').textContent='新增獎勵項目'; document.getElementById('rName').value=''; document.getElementById('rScore').value=''; document.getElementById('rewardSheet').classList.add('show'); }
function openEditReward(index) { const r=rewards.find(rw=>rw.index===index); if(!r)return; editRewardIndex=index; document.getElementById('rewardFormTitle').textContent='編輯獎勵項目'; document.getElementById('rName').value=r.name; document.getElementById('rScore').value=r.score; document.getElementById('rewardSheet').classList.add('show'); }
function closeRewardSheet() { document.getElementById('rewardSheet').classList.remove('show'); }
async function saveReward() {
  const name=document.getElementById('rName').value.trim();
  const score=parseInt(document.getElementById('rScore').value);
  if(!name) return showToast('請輸入獎勵名稱');
  if(!score||score<=0) return showToast('請輸入正確分數');
  const res = editRewardIndex!==null ? await api('updateReward',{index:editRewardIndex,name,score,status:'上架'}) : await api('addReward',{name,score});
  if(res?.success){closeRewardSheet();showToast('✅ 已儲存');loadAdmin();loadRewards();}
}

// TOAST
let toastTimer;
function showToast(msg) {
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),2800);
}

// CLOSE SHEETS ON OVERLAY CLICK
['confirmSheet','behaviorSheet','rewardSheet'].forEach(id=>{
  document.getElementById(id).addEventListener('click',function(e){if(e.target===this)this.classList.remove('show');});
});
</script>
</body>
</html>
